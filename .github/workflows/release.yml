name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    # Windows runner: PyInstaller bundles pywin32 / win32com (Windows-only).
    runs-on: windows-latest
    permissions:
      # Required so action-gh-release can create the release and upload assets.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and runtime dependencies
        # .[build] pulls pyinstaller; installing the package (editable) brings
        # in all runtime deps declared in pyproject so PyInstaller can collect them.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build GCalSync.exe
        # Replicates the PyInstaller invocation from build.bat exactly.
        # Invoked via "python -m PyInstaller" to avoid build.bat's interactive `pause`.
        # --distpath . writes GCalSync.exe to the repo root, where installer.iss expects it.
        run: >
          python -m PyInstaller
          --onefile
          --name GCalSync
          --distpath .
          --workpath build\work
          --specpath build
          --collect-all msal
          --collect-all google
          --collect-all googleapiclient
          --collect-all pystray
          --collect-all PIL
          --hidden-import win32timezone
          --hidden-import win32com.client
          --hidden-import pywintypes
          --hidden-import dedup
          --noconfirm
          --clean
          src\app.py

      - name: Install Inno Setup
        # ISCC.exe is placed on PATH by the Chocolatey package.
        run: choco install innosetup -y

      - name: Compile installer
        # Produces installer/GCalSync-Setup.exe (OutputDir/OutputBaseFilename in installer.iss).
        run: iscc installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/GCalSync-Setup.exe
